# LiteBox 配置示例。
#
# 复制为 litebox.yaml 后按需修改。所有项都可以用 LITEBOX_ 前缀的环境变量覆盖,
# 环境变量优先级高于本文件。

http:
  # 默认只监听回环,由 Nginx 反代对外提供服务。
  listen: "127.0.0.1:8080"
  # 用于生成订阅地址,必须与实际对外域名一致。
  base_url: "https://panel.example.com"
  # 经 HTTPS 反代时必须为 true;本地 HTTP 调试时置 false,否则浏览器不保存 Cookie。
  secure_cookie: true
  read_timeout: 30s
  write_timeout: 60s
  shutdown_timeout: 15s

database:
  path: "/var/lib/litebox/litebox.db"
  busy_timeout: 5s

security:
  # 主密钥用于加密用户 UUID 与节点 REALITY 私钥。
  # 强烈建议改用环境变量 LITEBOX_MASTER_KEY 提供,不要写进本文件。
  # 生成方式:litebox genkey
  # 警告:主密钥丢失后,已加密的 UUID 与节点私钥将无法还原。
  master_key: ""
  session_ttl: 24h
  login_max_attempts: 5
  login_window: 15m
  login_lockout: 15m

log:
  level: "info"   # debug / info / warn / error
  format: "text"  # text / json
