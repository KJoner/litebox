# LiteBox 配置示例。
#
# 复制为 litebox.yaml 后按需修改。所有项都可以用 LITEBOX_ 前缀的环境变量覆盖,
# 环境变量优先级高于本文件。

http:
  # 默认只监听回环,由 Nginx 反代对外提供服务。
  listen: "127.0.0.1:8080"
  # 用于生成订阅地址,必须与实际对外域名一致。
  base_url: "https://panel.example.com"
  # 经 HTTPS 反代时必须为 true;本地 HTTP 调试时置 false,否则浏览器不保存 Cookie。
  secure_cookie: true
  read_timeout: 30s
  write_timeout: 60s
  shutdown_timeout: 15s

database:
  path: "/var/lib/litebox/litebox.db"
  busy_timeout: 5s

security:
  # 主密钥用于加密用户 UUID 与节点 REALITY 私钥。
  # 强烈建议改用环境变量 LITEBOX_MASTER_KEY 提供,不要写进本文件。
  # 生成方式:litebox genkey
  # 警告:主密钥丢失后,已加密的 UUID 与节点私钥将无法还原。
  master_key: ""
  session_ttl: 24h
  login_max_attempts: 5
  login_window: 15m
  login_lockout: 15m

node:
  # 存放要分发到节点的 sing-box 二进制,文件名形如 sing-box-linux-amd64。
  # 由 scripts/build-singbox.sh 构建,必须带 with_v2ray_api 标签。
  binary_dir: "/opt/litebox/assets/singbox"
  ssh_dial_timeout: 20s
  deploy_timeout: 5m
  # 用户变更后的合并窗口:连续编辑多个用户时,同一节点只在最后一次变更
  # 静默 deploy_debounce 后重启一次。每次重启都会中断在线连接,合并是必要的。
  deploy_debounce: 4s
  # 持续不断的变更不能把部署无限推迟,这是兜底上限。
  deploy_max_delay: 30s

traffic:
  # 流量同步周期。
  #
  # 它同时决定了意外重启(OOM、宿主机重启、崩溃)的最大流量损失窗口:
  # sing-box 的计数器是纯内存的,未同步部分随进程退出永久丢失,无补救手段。
  # 面板自己触发的重启会先强制同步,不受此窗口影响。
  sync_interval: 60s

subscription:
  # 下发给 sing-box 客户端配置的本地混合入站端口。
  client_mixed_port: 2080

log:
  level: "info"   # debug / info / warn / error
  format: "text"  # text / json
