name: release

# 正式发布(VNext DEPLOY10):只在 v* tag 上跑。普通提交与 PR 只跑 ci.yml,不发布任何镜像。
#
#   测试(SQLite + PostgreSQL)→ 多架构镜像构建并推送 → 冒烟 → 核对推送后的 digest 与两种架构都在 →
#   从镜像里取出主控与节点产物打成发布包 → SHA256SUMS + SBOM → GitHub Release
#
# 需要仓库 secrets:DOCKERHUB_USERNAME、DOCKERHUB_TOKEN(Docker Hub 的访问令牌,只给推送 kjoner/litebox 的权限)。
# 预发布 tag(带 -,例如 v1.0.0-rc.1)不动 latest,在 GitHub 上标成 pre-release。

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: kjoner/litebox

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: lbtest
          POSTGRES_PASSWORD: lbtest
          POSTGRES_DB: lbtest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lbtest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: 前端占位产物
        run: mkdir -p web/dist && echo '<!doctype html><title>LiteBox</title>' > web/dist/index.html
      - run: go vet ./...
      - name: gofmt
        run: test -z "$(gofmt -l $(git ls-files '*.go' | grep -v '^phase0/'))"
      - name: go test(SQLite)
        run: go test ./... -count=1
      - name: go test(PostgreSQL)
        env:
          LITEBOX_TEST_PG_DSN: postgres://lbtest:lbtest@127.0.0.1:5432/lbtest?sslmode=disable
        run: go test ./... -count=1
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  image:
    needs: test
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        name: 版本与标签
        run: |
          v="${GITHUB_REF_NAME}"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          tags="${IMAGE}:${v},${IMAGE}:sha-${GITHUB_SHA::12}"
          if [[ "$v" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            tags="${tags},${IMAGE}:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: 核对推送后的 digest 与架构
        run: |
          want="${{ steps.build.outputs.digest }}"
          got="$(docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          [ "$want" = "$got" ] || { echo "推送后的 digest $got 与构建的 $want 不一致"; exit 1; }
          for arch in amd64 arm64; do
            docker buildx imagetools inspect "${IMAGE}@${want}" | grep -q "linux/${arch}" || { echo "缺少 linux/${arch}"; exit 1; }
          done
      - name: 冒烟:用推送的那个 digest 起一个主控
        run: |
          ref="${IMAGE}@${{ steps.build.outputs.digest }}"
          docker run --rm "$ref" version
          key="$(docker run --rm "$ref" genkey 2>/dev/null)"
          docker run -d --name smoke -e LITEBOX_MASTER_KEY="$key" -p 127.0.0.1:18080:8080 "$ref"
          for i in $(seq 1 30); do
            curl -fsS 127.0.0.1:18080/api/health && break
            sleep 2
          done
          curl -fsS 127.0.0.1:18080/api/health | grep -q '"status":"ok"'
          docker exec smoke sh -c 'test -s /opt/litebox/assets/release-manifest.json'
          docker rm -f smoke

  release:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: 从镜像里取出发布包
        run: |
          v="${{ needs.image.outputs.version }}"
          ref="${IMAGE}@${{ needs.image.outputs.digest }}"
          mkdir -p dist
          for arch in amd64 arm64; do
            root="litebox_${v}_linux_${arch}"
            mkdir -p "$root/bin" "$root/scripts"
            cid="$(docker create --platform "linux/${arch}" "$ref")"
            docker cp "$cid:/usr/local/bin/litebox" "$root/bin/litebox"
            docker cp "$cid:/opt/litebox/assets" "$root/assets"
            docker rm "$cid"
            cp scripts/install.sh scripts/upgrade.sh scripts/restore.sh "$root/scripts/"
            cp -r deploy "$root/deploy"
            cp LICENSE README.md "$root/"
            tar -czf "dist/${root}.tar.gz" "$root"
          done
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
          cat dist/SHA256SUMS
      - uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ needs.image.outputs.digest }}
          format: spdx-json
          output-file: dist/litebox-${{ needs.image.outputs.version }}.sbom.spdx.json
          upload-artifact: false
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.image.outputs.version }}"
          flags=()
          [ "${{ needs.image.outputs.prerelease }}" = "true" ] && flags+=(--prerelease)
          cat > notes.md <<EOF
          镜像:\`${IMAGE}:${v}\`(digest \`${{ needs.image.outputs.digest }}\`,linux/amd64 + linux/arm64)

          源码提交:\`${GITHUB_SHA}\`。节点产物的版本、能力与 sha256 见发布包里的 \`assets/release-manifest.json\`。
          部署与升级见仓库根目录的 \`README.md\` 与 \`deploy/\` 目录。
          EOF
          gh release create "$v" dist/* --title "LiteBox $v" --notes-file notes.md "${flags[@]}"
