# LiteBox 反向代理示例。
#
# LiteBox 默认只监听 127.0.0.1:8080,由 Nginx 负责 TLS 终止与对外服务。
# 使用本配置时,litebox.yaml 中必须设置 http.secure_cookie: true,
# 否则会话 Cookie 不会带 Secure 属性。

server {
    listen 80;
    listen [::]:80;
    server_name panel.example.com;

    # ACME 质询保留给证书签发工具。
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name panel.example.com;

    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # 面板不应被搜索引擎收录。
    location = /robots.txt {
        add_header Content-Type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # 登录接口额外限速,配合后端的失败次数限流。
    location = /api/auth/login {
        limit_req zone=litebox_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/litebox_proxy_params;
    }

    # 订阅地址里的 Token 就是凭据,完整记进 access_log 等于把它明文落盘,
    # 日志备份、日志采集、误开目录列表都会把它带走。这里必须关掉访问日志。
    # 谁在什么时候拉过订阅,LiteBox 自己有记录(用户详情页可见)。
    location ~ ^/sub/ {
        access_log off;
        limit_req zone=litebox_sub burst=10 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/litebox_proxy_params;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/litebox_proxy_params;
    }
}

# 将以下内容保存为 /etc/nginx/litebox_proxy_params:
#
#   proxy_http_version 1.1;
#   proxy_set_header Host              $host;
#   proxy_set_header X-Real-IP         $remote_addr;
#   proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
#   proxy_set_header X-Forwarded-Proto $scheme;
#   proxy_read_timeout 600s;
#   proxy_send_timeout 600s;
#
# proxy_read_timeout 必须 >= 面板的长操作上限(10 分钟):装二进制、部署、
# 切换出口这些要连 SSH 跑好几轮、甚至连带部署第二台机器,慢速 NAT 机上
# 一次就可能超过一两分钟。反代在响应到达之前超时的话,浏览器收到的是
# 「操作失败」或 502,而**操作本身在后端会继续跑到成功**(它与请求 ctx
# 解绑)—— 一次成功的部署被显示成失败,管理员照着去重试,又白重启一次服务。
# proxy_send_timeout 管的是上传方向(27MB 的 sing-box 二进制走这条)。
# 普通请求毫秒级返回,不受这个大超时影响。
#
# 并在 http 块中声明限速区:
#
#   limit_req_zone $binary_remote_addr zone=litebox_login:10m rate=10r/m;
#   limit_req_zone $binary_remote_addr zone=litebox_sub:10m   rate=60r/m;
